<!DOCTYPE html>
<html>
<head>
<title> Form HTML <title>
</head>
<body>
<h3> Penjelasan </h3>
 <p> Form HTML digunakan untuk membuat formulir yang memungkinkan pengguna memasukan data seperti nama,NIM,dll.
 </p>
<h3> Contoh kode </h3>
<code>
&lt;form&gt<br>
	&lt;input type="text"&gt;<br>
	&lt;input type="submit" value="simpan"&gt;<br>
&lt;/form&gt;
<h3>Hasil</h3>
<p> Identitas Mahasiswa </p>
<form>
	<table>
		<tr>
			<td width="140">Nama</td>
			<td><input type="text"></td>
		</tr>
		<tr>
			<td>NIM</td>
			<td><input type="number"></td>	
		</tr>
		<tr>
			<td>Tanggal lahir</td>
			<td><input type="date"></td>
		</tr>
		<tr>
			<td>Jenis Kelamin</td>
			<td><input type="radio" name="jk"> Laki-laki 
			<td><input type="radio" name="jk"> Perempuan
			</td>
		</tr>
		<tr>
			<td>Fakultas</td>
			<td><input type="text"></td>
		</tr>
		<tr>
			<td>Prodi</td>
			<td><input type="text"></td>
		</tr>
		<tr>
			<td></td>
			<td><input type="submit" value="simpan">
				<input type="reset" value="reset">
				<input type="button" value="kembali">
			</td>
		</tr>
	</table>
</form>

	<a href="../index.html">Kembali ke halaman utama</a>
</P>

</body>
</html>
